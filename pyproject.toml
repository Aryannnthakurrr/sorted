[project]
name = "sorted-brain"
version = "0.1.0"
description = "Sorted: a household admin assistant that compiles repeated LLM work into tested local code."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "python-dateutil>=2.9",
    "openai>=1.40",
]

[project.scripts]
brain = "brain.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "fpdf2>=2.7",  # only used by scripts/gen_samples.py to write the sample PDFs
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["brain"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
