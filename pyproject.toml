[project]
name = "sorted-brain"
version = "0.1.0"
description = "Sorted: a household admin assistant that compiles repeated LLM work into tested local code."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "python-dateutil>=2.9",
    "openai>=1.40",
    "fastapi>=0.143.0",
    "uvicorn>=0.54.0",
    "pdfplumber>=0.11.10",
    "pyyaml>=6.0.3",
    "apscheduler>=3.10,<4",
    "scikit-learn>=1.9.1",
    "joblib>=1.6.0",
    "python-telegram-bot>=21",
    "mcp>=2.3.0",
]

[project.scripts]
brain = "brain.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "fpdf2>=2.7",  # only used by scripts/gen_samples.py to write the sample PDFs
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["brain"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI Depends() in defaults is the idiom

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
